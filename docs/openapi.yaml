openapi: 3.0.3
info:
  title: Audiobookshelf-Hardcover Sync API
  description: |
    This API allows you to manage sync profiles for synchronizing audiobooks between Audiobookshelf and Hardcover.
    
    ## Authentication
    
    The API uses JWT authentication. Include the JWT token in the `Authorization` header:
    
    ```
    Authorization: Bearer <token>
    ```

    When authentication is enabled, newly created profiles belong to the
    authenticated user. For authenticated `/api/profiles` APIs, users and
    viewers can access only their owned profiles; viewers are read-only, while
    administrators can access all profiles. Profile API responses never echo
    `audiobookshelf_token` or `hardcover_token`, regardless of authentication
    or role. Legacy ownerless profiles are administrator-only: they are not
    listed or accessible to ordinary users, and there is currently no way to
    assign one of these profiles to a user. Foreign and nonexistent profile
    requests return a non-enumerating `404`. The public
    `/api/status` endpoint remains scalar and redacted. Authentication disabled
    preserves unrestricted profile access.
    
    ## Rate Limiting
    
    The API is rate limited to 100 requests per minute per IP address.
  version: 1.0.0
  contact:
    name: API Support
    url: https://github.com/drallgood/audiobookshelf-hardcover-sync
servers:
  - url: http://localhost:8080/api
    description: Development server
  - url: https://api.example.com/v1
    description: Production server

tags:
  - name: Profiles
    description: Manage sync profiles
  - name: Sync
    description: Control sync operations
  - name: Status
    description: Check sync status
  - name: Editions
    description: Create Hardcover editions for needs-review books

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  
  schemas:
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Profile not found"
    
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          description: Response data

    AcceptedSyncRun:
      type: object
      required: [message, run_id, state, queued_at, dry_run]
      properties:
        message:
          type: string
          example: Sync started
        run_id:
          type: string
          description: Authoritative ID assigned to the accepted run.
          example: profile-123-1700000000000000000
        state:
          type: string
          enum: [queued]
          description: The accepted run is durably queued before worker launch; response delivery may race worker processing.
        queued_at:
          type: string
          format: date-time
        dry_run:
          type: boolean
          description: True when the accepted run will not perform Hardcover mutations.
    
    Profile:
      type: object
      properties:
        id:
          type: string
          example: "profile-123"
        name:
          type: string
          example: "My Audiobooks"
        active:
          type: boolean
          example: true
        createdAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2023-01-01T00:00:00Z"
        last_successful_at:
          type: string
          format: date-time
          nullable: true
          description: Time the most recent non-dry-run run completed successfully.
    
    ProfileConfig:
      type: object
      properties:
        audiobookshelfUrl:
          type: string
          example: "https://audiobooks.example.com"
        syncConfig:
          type: object
          properties:
            libraryId:
              type: string
              example: "lib1"
            includeTags:
              type: array
              items:
                type: string
              example: ["hardcover"]
            excludeTags:
              type: array
              items:
                type: string
              example: ["exclusive"]
            state_file:
              type: string
              description: Optional relative state-file path. Absolute paths and relative paths that lexically escape the effective data directory are rejected; when paths.data_dir is empty, /data is used. The profile-specific filename component, including the encoded profile ID, must fit the supported 255-byte baseline.
              pattern: '^(?!/).*$'
            dry_run:
              type: boolean
              example: false
    
    ProfileWithConfig:
      allOf:
        - $ref: '#/components/schemas/Profile'
        - type: object
          properties:
            config:
              $ref: '#/components/schemas/ProfileConfig'
    
    AggregateSyncStatus:
      type: object
      description: Scalar status exposed by the public aggregate status endpoint. Per-book arrays are available from the authenticated run-details endpoint.
      properties:
        profile_id:
          type: string
        profile_name:
          type: string
        last_attempted_at:
          type: string
          format: date-time
          nullable: true
          description: Time the most recent run was accepted, including dry-run, failed, or canceled runs.
        last_successful_at:
          type: string
          format: date-time
          nullable: true
          description: Time the most recent non-dry-run run completed successfully; null when no such run exists.
        snapshot:
          $ref: '#/components/schemas/AggregateSnapshot'

    AggregateSnapshot:
      type: object
      description: Scalar current-run snapshot used for inexpensive aggregate polling.
      required: [run_id, queued_at, processing_started_at, last_activity_at, last_processed_at, finished_at, state, dry_run, books_total, processed_so_far, outcome_counts, unattempted_count]
      properties:
        run_id: {type: string}
        queued_at: {type: string, format: date-time}
        processing_started_at:
          type: string
          format: date-time
          description: Zero timestamp until the worker begins processing.
        last_activity_at:
          type: string
          format: date-time
          description: Zero timestamp until the run records worker activity.
        last_processed_at:
          type: string
          format: date-time
          description: Zero timestamp until a candidate receives an outcome.
        finished_at:
          type: string
          format: date-time
          description: Zero timestamp until a terminal phase is recorded.
        dry_run:
          type: boolean
          description: True when no Hardcover mutations are performed and a would_sync outcome represents planned work.
        state:
          type: string
          enum: [queued, running, finalizing, completed, canceled, failed]
          description: Canonical lifecycle phase for this run.
        unattempted_count:
          type: integer
          description: Candidates not yet assigned an outcome; zero when processed_so_far reaches books_total or the total is unknown.
        books_total:
          type: integer
          description: Number of candidates observed before processing limits; zero means the total is unknown or has not been observed yet.
        processed_so_far:
          type: integer
          description: Number of books processed so far, independent of books_total.
        outcome_counts:
          $ref: '#/components/schemas/OutcomeCounts'

    OutcomeCounts:
      type: object
      required: [synced, already_current, skipped, needs_review, not_found, failed, would_sync]
      properties:
        synced: {type: integer}
        already_current: {type: integer}
        skipped: {type: integer}
        needs_review: {type: integer}
        not_found: {type: integer}
        failed: {type: integer}
        would_sync: {type: integer}

    BookOutcomeRecord:
      type: object
      required: [book_id, outcome, updated_at]
      properties:
        book_id: {type: string}
        outcome:
          type: string
          enum: [synced, already_current, skipped, needs_review, not_found, failed, would_sync]
        title: {type: string}
        author: {type: string}
        asin: {type: string}
        isbn: {type: string}
        cover_url: {type: string, format: uri}
        format: {type: string}
        series: {type: string}
        series_number: {type: string}
        reason: {type: string}
        error: {type: string}
        match_method: {type: string}
        hardcover_book_id: {type: string}
        edition_id: {type: string}
        hardcover_title: {type: string}
        hardcover_author: {type: string}
        hardcover_published_year: {type: string}
        hardcover_cover_url: {type: string, format: uri}
        hardcover_publisher: {type: string}
        hardcover_asin: {type: string}
        hardcover_isbn: {type: string}
        hardcover_slug: {type: string}
        hardcover_series: {type: string}
        hardcover_series_number: {type: string}
        updated_at: {type: string, format: date-time}

    SyncSnapshot:
      type: object
      required: [run_id, queued_at, processing_started_at, last_activity_at, last_processed_at, finished_at, state, dry_run, unattempted_count, books_total, processed_so_far, outcome_counts, book_outcomes]
      properties:
        profile_id: {type: string}
        audiobookshelf_url:
          type: string
          format: uri
          description: Base URL used to build Audiobookshelf item links in authenticated run details. Omitted from aggregate status responses.
        run_id: {type: string}
        queued_at: {type: string, format: date-time}
        processing_started_at:
          type: string
          format: date-time
          description: Zero timestamp until the worker begins processing.
        last_activity_at:
          type: string
          format: date-time
          description: Zero timestamp until the run records worker activity.
        last_processed_at:
          type: string
          format: date-time
          description: Zero timestamp until a candidate receives an outcome.
        finished_at:
          type: string
          format: date-time
          description: Zero timestamp until a terminal phase is recorded.
        dry_run:
          type: boolean
          description: True when no Hardcover mutations are performed and would_sync records indicate planned changes.
        run_error:
          type: string
          nullable: true
          description: Run-level error for failed or canceled runs; absent when no run error was recorded.
        unattempted_count:
          type: integer
          description: Candidates not yet assigned an outcome; when books_total is unknown this remains zero until a denominator is observed.
        state:
          type: string
          enum: [queued, running, finalizing, completed, canceled, failed]
          description: Canonical lifecycle phase. A canceled run retains its partial snapshot; it does not become idle or completed.
        books_total:
          type: integer
          description: Number of candidates observed before processing limits; zero means the total is unknown or has not been observed yet. This is independent of processed_so_far.
        processed_so_far:
          type: integer
          description: Sum of all outcome_counts categories, independent of books_total.
        outcome_counts:
          $ref: '#/components/schemas/OutcomeCounts'
        book_outcomes:
          type: array
          items:
            $ref: '#/components/schemas/BookOutcomeRecord'

    EditionDraft:
      type: object
      description: Draft of a new Hardcover edition built from an Audiobookshelf item. The editable fields can be edited and sent back as an EditionCreateRequest. The remaining fields (hardcover_book_id, reading_format, author_names, narrator_names, publisher_name, cover_url, dry_run, warnings) are informational and must be omitted from the create request, which rejects unknown fields with 400.
      required: [hardcover_book_id, title, subtitle, asin, isbn_10, isbn_13, release_date, edition_information, edition_format, reading_format, audio_seconds, language_id, country_id, author_ids, narrator_ids, publisher_id, author_names, narrator_names, publisher_name, cover_url, dry_run, warnings]
      properties:
        hardcover_book_id:
          type: integer
          description: Hardcover book the edition will be attached to. Taken from the run record, never from the client.
        title: {type: string}
        subtitle: {type: string}
        asin: {type: string}
        isbn_10: {type: string}
        isbn_13: {type: string}
        release_date:
          type: string
          description: Release date as YYYY-MM-DD; may be empty.
          example: "2024-01-31"
        edition_information: {type: string}
        edition_format: {type: string}
        reading_format:
          type: string
          enum: [audiobook, ebook]
          description: Decided by the Audiobookshelf item (an ebook file and no audio is an ebook) and applied by the server when creating; it cannot be sent in the create request. An ebook draft has no narrators or audio_seconds.
        audio_seconds: {type: integer}
        language_id: {type: integer}
        country_id: {type: integer}
        author_ids:
          type: array
          description: Never null; empty when no author was resolved on Hardcover.
          items: {type: integer}
        narrator_ids:
          type: array
          description: Never null.
          items: {type: integer}
        publisher_id:
          type: integer
          description: Hardcover publisher ID; 0 means no publisher.
        author_names:
          type: string
          description: Display string for the author IDs.
        narrator_names:
          type: string
          description: Display string for the narrator IDs.
        publisher_name:
          type: string
          description: Display string for the publisher.
        cover_url:
          type: string
          description: Audiobookshelf cover URL; empty when the item has no cover.
        dry_run:
          type: boolean
          description: True when the profile is in dry-run mode, so creating the edition will not change Hardcover.
        warnings:
          type: array
          description: Things to review before creating the edition, such as no author resolved on Hardcover (creation would then fail), no release date, a publisher not found on Hardcover, or no narrator. A warning can also result from a Hardcover lookup that failed rather than found nothing, for example during an outage, and fetching the draft again may clear it. Never null; empty when there is nothing to flag.
          items: {type: string}

    EditionCreateRequest:
      type: object
      description: Edition fields to create on Hardcover. The body must be exactly one JSON object of at most 64 KiB. Unknown fields are rejected with 400; in particular book_id and image_url are not accepted, because the server takes the Hardcover book from the run record and the cover from Audiobookshelf. title and author_ids are required, but a missing value is reported by validation as 422, not 400. At least one of asin, isbn_10 and isbn_13 is also required, and an ISBN may be sent with hyphens or spaces. Validation also returns 422 for a missing identifier, an isbn_10 or isbn_13 that is not a 10- or 13-character ISBN, a malformed release_date, more than 50 author or narrator IDs, an author or narrator ID that is not positive, an edition_format longer than 100 characters, or a negative publisher_id, language_id, country_id, or audio_seconds.
      additionalProperties: false
      required: [title, author_ids]
      properties:
        title: {type: string}
        subtitle: {type: string}
        asin: {type: string}
        isbn_10: {type: string}
        isbn_13: {type: string}
        release_date:
          type: string
          description: Release date as YYYY-MM-DD.
          example: "2024-01-31"
        edition_information: {type: string}
        edition_format:
          type: string
          maxLength: 100
          description: Free text sent to Hardcover as the edition format after trimming whitespace; empty defaults to "Audiobook" ("Ebook" for an ebook item). At most 100 characters after trimming (counted in characters); a longer value returns 422.
        audio_seconds:
          type: integer
          description: Audio length in seconds. Not sent to Hardcover for an ebook item.
        language_id: {type: integer}
        country_id: {type: integer}
        author_ids:
          type: array
          minItems: 1
          maxItems: 50
          description: Hardcover author IDs; at least one is required, each must be positive.
          items: {type: integer}
        narrator_ids:
          type: array
          maxItems: 50
          description: Hardcover narrator IDs; each must be positive. Not sent to Hardcover for an ebook item.
          items: {type: integer}
        publisher_id:
          type: integer
          description: Hardcover publisher ID; 0 or omitted means no publisher.

    EditionCreateResult:
      type: object
      required: [edition_id, dry_run, warnings]
      properties:
        edition_id:
          type: integer
          description: ID of the created Hardcover edition, or of the existing edition, left unchanged, when it was detected as an existing audiobook edition of the same Hardcover book. 0 in dry-run mode, when nothing is created (the request is still validated).
        dry_run:
          type: boolean
          description: True when the profile is in dry-run mode and nothing was created on Hardcover.
        warnings:
          type: array
          description: Problems that did not stop the edition from being created. Never null; empty when there is nothing to report and always empty in dry-run mode. When the cover image could not be downloaded, uploaded, or attached it holds one entry, "The edition was created, but its cover image could not be uploaded."
          items: {type: string}

security:
  - BearerAuth: []

paths:
  /profiles:
    get:
      tags: [Profiles]
      summary: List all sync profiles
      responses:
        '200':
          description: List of sync profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Profile'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    post:
      tags: [Profiles]
      summary: Create a new sync profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, name, audiobookshelfUrl, audiobookshelfToken, hardcoverToken]
              properties:
                id:
                  type: string
                  maxLength: 244
                  pattern: '^(?!\.\.?$)[A-Za-z0-9._~-]+$'
                  description: Up to 244 ASCII RFC 3986 unreserved characters; "." and ".." are not valid profile IDs.
                  example: "profile-123"
                name:
                  type: string
                  example: "My Audiobooks"
                audiobookshelfUrl:
                  type: string
                  example: "https://audiobooks.example.com"
                audiobookshelfToken:
                  type: string
                  example: "abs-token-123"
                hardcoverToken:
                  type: string
                  example: "hc-token-456"
                syncConfig:
                  $ref: '#/components/schemas/ProfileConfig/syncConfig'
      responses:
        '201':
          description: Profile created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProfileWithConfig'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /profiles/{profileId}:
    get:
      tags: [Profiles]
      summary: Get a sync profile by ID
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      responses:
        '200':
          description: Profile details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ProfileWithConfig'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    put:
      tags: [Profiles]
      summary: Update a sync profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Updated Profile Name"
      responses:
        '200':
          description: Profile updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags: [Profiles]
      summary: Delete a sync profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      responses:
        '200':
          description: Profile deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /profiles/{profileId}/config:
    put:
      tags: [Profiles]
      summary: Update a profile's configuration
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                audiobookshelfUrl:
                  type: string
                  example: "https://new-audiobooks.example.com"
                audiobookshelfToken:
                  type: string
                  example: "new-abs-token-123"
                hardcoverToken:
                  type: string
                  example: "new-hc-token-456"
                syncConfig:
                  $ref: '#/components/schemas/ProfileConfig/syncConfig'
      responses:
        '200':
          description: Configuration updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /profiles/{profileId}/runs/{runId}/details:
    get:
      tags: [Status]
      summary: Get full details for an active or retained run of a profile
      description: Returns per-book outcomes when runId identifies the profile's active run or an exact retained terminal report. Unknown, other-profile, and evicted run IDs return 404; the endpoint never substitutes a newer run.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
        - name: runId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123-1700000000000000000-1"
      responses:
        '200':
          description: Full active or retained run snapshot details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/SyncSnapshot'
        '404':
          description: Profile, active run, or retained run not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /profiles/{profileId}/runs/{runId}/books/{bookId}/edition-draft:
    get:
      tags: [Editions]
      summary: Get a draft Hardcover edition for a needs-review book
      description: Builds a draft of a new Hardcover edition from the Audiobookshelf item of a book that a run with available details (the active run or a retained one) marked needs_review and that has a Hardcover candidate (hardcover_book_id). Hyphens and spaces are removed from the ISBN, and when it is valid the draft also fills the other ISBN form. The item must have an ASIN or a valid ISBN, otherwise the request is rejected with 409. Requires write permission on the profile. The profile's Audiobookshelf token is used only on the server to fetch the item and is never returned.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
        - name: runId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123-1700000000000000000-1"
        - name: bookId
          in: path
          required: true
          description: Audiobookshelf library item ID, from book_outcomes[].book_id of the run details.
          schema:
            type: string
          example: "li_abc123"
      responses:
        '200':
          description: Draft edition
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EditionDraft'
        '401':
          description: Authentication is enabled and the request is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is a viewer without write permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Profile (including another user's profile), run, book record, or Audiobookshelf item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The book is not needs_review or has no numeric Hardcover book ID, its Audiobookshelf item has no ASIN or valid ISBN, or the profile is being deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Audiobookshelf or Hardcover request failed; the message is generic and names only the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The service is shutting down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /profiles/{profileId}/runs/{runId}/books/{bookId}/edition:
    post:
      tags: [Editions]
      summary: Create a Hardcover edition for a needs-review book
      description: Creates a Hardcover edition for a book that a run with available details (the active run or a retained one) marked needs_review and that has a Hardcover candidate. Typically the draft from the edition-draft route is fetched, optionally edited, and posted back. The Hardcover book comes from the run record and the cover from Audiobookshelf. If the profile is in dry-run mode the request is still validated, but nothing is created on Hardcover and edition_id is 0. Creation continues even if the caller disconnects and is limited to 2 minutes. On shutdown, running syncs are cancelled first and in-flight creates are allowed to finish, bounded by the shutdown timeout; requests that start after shutdown begins get 503. Deleting a profile likewise waits for its in-flight edition creates (up to the create timeout), so the DELETE response can be delayed and can outlast the server write timeout even though the deletion succeeds. Before creating, Hardcover is searched for an existing audiobook edition with the same ASIN, ISBN-13 or ISBN-10 (an ISBN is also searched under its converted ISBN-10 or ISBN-13 form); an edition in another format, or with no reading format, is not a match (an ebook item is matched against ebook editions, an audiobook against audiobook editions). One of the same Hardcover book is returned untouched, so nothing is created and its cover and metadata are not changed, so the response does not distinguish reuse from creation. A race with another creator, or a failed lookup, can still let a new edition be created. If the found edition belongs to another book, or its book cannot be confirmed (unknown or merged book ID), the request is rejected with 409; retry, or add the edition manually on Hardcover. A dry run performs no lookup, so it never reports an existing edition or this conflict. Requires write permission on the profile.
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
        - name: runId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123-1700000000000000000-1"
        - name: bookId
          in: path
          required: true
          description: Audiobookshelf library item ID, from book_outcomes[].book_id of the run details.
          schema:
            type: string
          example: "li_abc123"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditionCreateRequest'
      responses:
        '200':
          description: Edition created, already existing, or (in dry-run mode) not created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/EditionCreateResult'
        '400':
          description: Malformed or oversize body, an unknown field (including book_id and image_url), or a body that is not exactly one JSON object
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication is enabled and the request is not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Caller is a viewer without write permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Profile (including another user's profile), run, book record, or Audiobookshelf item not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The book is not needs_review or has no numeric Hardcover book ID, the profile is being deleted, its Audiobookshelf item has no ASIN or valid ISBN, an edition create for the same book is already in progress, or the submitted ASIN or ISBN belongs to an edition of another Hardcover book or one whose book could not be confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The submitted edition fails validation; the error carries the message (for example, no author)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Audiobookshelf or Hardcover request failed; the message is generic and names only the service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: The service is shutting down
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /status:
    get:
      tags: [Status]
      summary: Get sync status for all profiles
      security: []
      responses:
        '200':
          description: Sync status for all profiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AggregateSyncStatus'
  
  /profiles/{profileId}/sync:
    post:
      tags: [Sync]
      summary: Start a sync for a profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      responses:
        '202':
          description: Sync accepted and queued successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/AcceptedSyncRun'
        '404':
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Sync already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    
    delete:
      tags: [Sync]
      summary: Cancel an in-progress sync for a profile
      parameters:
        - name: profileId
          in: path
          required: true
          schema:
            type: string
          example: "profile-123"
      responses:
        '200':
          description: Sync cancelled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Profile not found or no sync in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
